<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>송금 에이전트 프로토타입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">연구1 · 송금 에이전트 프로토타입</div>
    <div class="top-right">
      <span id="llm-chip" class="chip-status">규칙 기반 해석</span>
      <button id="btn-researcher" type="button" class="btn-ghost" title="Ctrl + .">연구자 패널</button>
    </div>
  </header>

  <!-- ============ 설정 화면 (연구자용) ============ -->
  <main id="setup" class="setup">
    <form id="setup-form" class="card setup-card">
      <h1>세션 설정</h1>

      <fieldset>
        <legend>참가자</legend>
        <div class="grid2">
          <label>참가자 ID<input id="pid" placeholder="P01" autocomplete="off"></label>
          <label>이름 <small>(메모 ‘30기 OOO’에 사용)</small><input id="pname" placeholder="홍길동" autocomplete="off"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>실험 조건</legend>
        <div class="cond-grid">
          <label class="cond"><input type="radio" name="cond" value="A1" checked><b>A1</b><span>낮은 복잡도 × 낮은 자동화</span></label>
          <label class="cond"><input type="radio" name="cond" value="A2"><b>A2</b><span>낮은 복잡도 × 높은 자동화</span></label>
          <label class="cond"><input type="radio" name="cond" value="B1"><b>B1</b><span>높은 복잡도 × 낮은 자동화</span></label>
          <label class="cond"><input type="radio" name="cond" value="B2"><b>B2</b><span>높은 복잡도 × 높은 자동화</span></label>
        </div>
        <div class="grid2">
          <label>높은 자동화 단계 간격 (ms)<input id="delay" type="number" min="500" step="100" value="2500"></label>
          <label class="check"><input id="show-task" type="checkbox" checked> 참가자에게 상황·과업 카드 보여주기</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>LLM (Gemini)</legend>
        <p class="hint">참가자의 말을 해석하는 데만 사용해요. 에이전트 문구는 시나리오 스크립트대로 고정이에요. 키가 없으면 규칙 기반 해석으로 동작해요.</p>
        <label>Gemini API 키
          <input id="api-key" type="password" placeholder="AIza…" autocomplete="off" spellcheck="false">
        </label>
        <label class="check"><input id="remember-key" type="checkbox"> 이 브라우저에 키 저장</label>
        <div class="grid2 model-row">
          <label>모델<input id="model" list="model-list" spellcheck="false"><datalist id="model-list"></datalist></label>
          <div class="btn-row">
            <button id="btn-models" type="button" class="btn-ghost">모델 목록</button>
            <button id="btn-test" type="button" class="btn-ghost">연결 테스트</button>
          </div>
        </div>
        <p id="llm-test" class="test-out" aria-live="polite"></p>
      </fieldset>

      <button type="submit" class="btn-start">세션 시작</button>
    </form>
  </main>

  <!-- ============ 실험 화면 ============ -->
  <main id="stage" class="stage" hidden>
    <aside id="task-card" class="card task-card">
      <div class="cond-title" id="cond-title"></div>
      <h2>상황</h2>
      <div id="task-situation"></div>
      <h2>과업 <small>AI에게 아래 과업을 요청해주세요</small></h2>
      <ul id="task-list"></ul>
    </aside>

    <div class="phone">
      <div class="phone-notch"></div>
      <div id="screen" class="screen"></div>
      <section class="agent-panel">
        <div class="agent-head">
          <span class="agent-avatar">AI</span>
          <b>AI 도우미</b>
          <span id="agent-state" class="agent-state" data-state="idle">대기</span>
        </div>
        <div id="chat" class="chat" aria-live="polite"></div>
        <div id="manual-bar" class="manual-bar" hidden>
          <span>위 화면에서 직접 고칠 수 있어요</span>
          <button id="btn-manual-done" type="button">AI에게 다시 맡기기</button>
        </div>
        <div id="chips" class="chips"></div>
        <div id="controls" class="controls" hidden>
          <button id="btn-stop" type="button" class="ctl stop">■ 중지</button>
          <button id="btn-manual" type="button" class="ctl manual">✋ 직접조작</button>
        </div>
        <form id="composer" class="composer" autocomplete="off">
          <button id="mic" type="button" class="mic" title="음성 입력">🎤</button>
          <input id="msg" placeholder="여기에 말씀하세요">
          <button id="send" type="submit" class="send">보내기</button>
        </form>
      </section>
    </div>
  </main>

  <!-- ============ 연구자 패널 ============ -->
  <aside class="drawer">
    <div class="drawer-head">
      <b>연구자 패널</b>
      <button id="btn-close-drawer" type="button" class="btn-ghost">닫기</button>
    </div>
    <h3>진행 단계</h3>
    <ol id="stepper" class="stepper"></ol>
    <h3>요약</h3>
    <div id="summary" class="summary"></div>
    <div class="btn-row wrap">
      <button id="btn-json" type="button" class="btn-ghost">이 세션 JSON</button>
      <button id="btn-csv" type="button" class="btn-ghost">이 세션 이벤트 CSV</button>
      <button id="btn-all" type="button" class="btn-ghost">전체 세션 요약 CSV (<span id="session-count">0</span>)</button>
      <button id="btn-clear" type="button" class="btn-ghost danger">기록 지우기</button>
      <button id="btn-reset" type="button" class="btn-ghost">설정으로 / 새 세션</button>
    </div>
    <h3>이벤트 로그</h3>
    <div id="log-wrap" class="log-wrap">
      <table id="log"><thead><tr><th>초</th><th>단계</th><th>이벤트</th><th>내용</th></tr></thead><tbody></tbody></table>
    </div>
  </aside>

  <script src="js/scenarios.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
